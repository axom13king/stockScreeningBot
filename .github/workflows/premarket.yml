name: Premarket Risk Check

on:
  schedule:
    # 日本時間 6:47頃(東証寄り付き9:00の前、余裕を持たせる) = UTC 21:47(前日)
    # 日経225先物・S&P500先物・VIXを見て、寄り付き前にリスクオフの兆候を検知する。
    # 8時台JST(≒UTC23時台)は9/23頃から実行が2時間以上遅延し寄り付き後になってしまうことが
    # あったため、より早い時間帯に変更してバッファを確保する。
    - cron: "47 21 * * 0-4"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python premarket_check.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
