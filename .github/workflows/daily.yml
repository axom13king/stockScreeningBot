name: Daily Screening

on:
  schedule:
    # 日本時間 18:23頃(東証大引け15:00から3時間強のバッファ) = UTC 09:23
    # 大引け直後だとYahoo Financeの終値確定が間に合わず前日データを拾うことがあったため後ろ倒し。
    # 毎時0分・30分はリクエストが集中し遅延・間引きされやすいため、あえて半端な分を指定
    - cron: "23 9 * * 1-5"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: swing-cache-${{ github.run_id }}
          restore-keys: |
            swing-cache-

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
