name: Daily Screening

on:
  # GitHub自身のscheduleトリガーは時間帯を変えても2〜8時間遅延することが判明したため廃止。
  # 代わりに外部cronサービス(cron-job.org)からこのworkflow_dispatchを直接叩いて起動する。
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .cache
          # v2: 株式分割で分割前後の基準が混ざった旧キャッシュを捨てるために世代を上げた
          key: swing-cache-v2-${{ github.run_id }}
          restore-keys: |
            swing-cache-v2-

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
