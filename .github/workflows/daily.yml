name: Daily Screening

on:
  schedule:
    # 日本時間 21:47頃 = UTC 12:47
    # 18時台JST(≒UTC9時台)は9/23頃から実行が4〜5時間遅延するようになった。多くの
    # 「日本株終値バッチ」が同じ時間帯に集中している可能性があるため、時間帯ごと変更。
    # 毎時0分・30分はリクエストが集中し遅延・間引きされやすいため、あえて半端な分を指定
    - cron: "47 12 * * 1-5"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: swing-cache-${{ github.run_id }}
          restore-keys: |
            swing-cache-

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
